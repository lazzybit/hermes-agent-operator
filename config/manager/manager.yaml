apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent-controller
  template:
    metadata:
      labels:
        app: hermes-agent-controller
    spec:
      serviceAccountName: hermes-agent-controller
      containers:
        - name: manager
          image: ghcr.io/lazzybit/hermes-agent-controller:canary
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
