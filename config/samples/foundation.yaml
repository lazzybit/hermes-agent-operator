# Experimental resources only. Images and commands must be supplied and tested.
# Nonsecret settings live in spec.config; supply the referenced dotenv credential Secrets.
# SSH CA, certificates and terminal startup are managed automatically.
apiVersion: hermes.nousresearch.com/v1alpha1
kind: Hermes
metadata:
  name: demo
  namespace: hermes-lab
spec:
  # Project gateway image: official Hermes plus /usr/local/bin/hermes-gateway-init.
  # A custom image is allowed. Without that init entry, home, config, credential,
  # and plugin integration do not run. Use a tested digest in a real deployment.
  image: ghcr.io/lazzybit/hermes-agent-gateway:canary
  command: [/opt/hermes/.venv/bin/hermes, -p, default, gateway, run, --external-supervisor]
  storage:
    size: 1Gi
  config: {} # nonsecret Hermes YAML; SOUL.md remains writable state
  credentialsSecret:
    name: gateway-credentials
    key: .env
---
apiVersion: hermes.nousresearch.com/v1alpha1
kind: HermesProfile
metadata:
  name: assistant
  namespace: hermes-lab
spec:
  hermesRef: demo
  storage:
    size: 1Gi
  config: {}
  credentialsSecret:
    name: profile-credentials-assistant
    key: .env
  terminal:
    image: ghcr.io/lazzybit/hermes-agent-terminal:canary
    storage:
      size: 5Gi
